version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    ignore:
      # TS 7 ships no JavaScript API yet, which `svelte-kit sync` and svelte-check need:
      # https://github.com/sveltejs/kit/issues/17537
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "[Deps] "
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "[Deps] "
